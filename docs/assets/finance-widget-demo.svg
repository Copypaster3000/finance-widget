      .label { fill: #aaa99b; font-size: 10px; letter-spacing: 2.4px; }
      .small { fill: #aead9f; font-size: 11px; letter-spacing: 1px; }
      .value { fill: #f0efe7; }
      .amber { fill: #d0a22c; }
      .line { stroke: #727266; stroke-opacity: 0.42; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#desk)"/>
