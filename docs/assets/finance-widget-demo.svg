<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Finance Widget fictional portfolio preview</title>
  <desc id="desc">A warm charcoal desktop finance widget showing fictional MSFT, SPY, and ETH holdings.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8b59f"/>
      <stop offset="0.46" stop-color="#92917d"/>
      <stop offset="1" stop-color="#6f7060"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#393a32" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#2f302a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0a22c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d0a22c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
