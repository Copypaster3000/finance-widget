name: Bug report
description: Report reproducible Finance Widget behavior using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real holdings, portfolio values, local store files, credentials, personal paths, or unredacted screenshots. Replace them with synthetic examples."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use fictional symbols, dates, quantities, and values.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Data safety confirmation
      options:
        - I used synthetic data and removed personal information
    validations:
      required: true
