name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 9 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
